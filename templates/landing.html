{% extends "base.html" %}
{% block body %}
<style>
.hero { text-align: center; margin: 20vh auto; max-width: 800px; position: relative; }
.hero h1 {
    font-size: 4.5rem;
    font-weight: 900;
    margin: 0 0 0.2em;
    background: linear-gradient(135deg, #5865F2, #EB459E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.8s ease-out;
}
.hero .subtitle {
    font-size: 1.5rem;
    opacity: 0.7;
    margin-bottom: 3.5rem;
    animation: fadeUp 0.8s ease-out 0.15s backwards;
}
.btn-dc {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #5865F2;
    color: white;
    padding: 18px 36px;
    border-radius: 12px;
    font-size: 1.15rem;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 6px 24px rgba(88,101,242,0.35);
    animation: fadeUp 0.8s ease-out 0.3s backwards;
}
.btn-dc:hover {
    background: #4752c4;
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(88,101,242,0.55);
    color: white;
}
.btn-dc svg { width: 26px; height: 26px; }
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.bg-glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88,101,242,0.15) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: -1;
    animation: pulse 4s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
}
</style>

<div class="hero">
    <div class="bg-glow"></div>
    <h1>來到 Bot</h1>
    <p class="subtitle">24 小時為你上線</p>
    <a href="/auth/discord" class="btn-dc">

</div>
