<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>{{ server_name }} - BotShop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0e1015;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#16181f;border-right:1px solid #22252e;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10}
.sidebar .logo{padding:16px 20px;font-weight:700;font-size:1.02rem;border-bottom:1px solid #22252e;display:flex;align-items:center;gap:8px}
.sidebar .logo a{color:#8890a8;text-decoration:none;font-size:.85rem}
.sidebar .logo a:hover{color:white}
.sidebar nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#b8bcc8;font-size:.88rem;cursor:pointer;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:#1f222b;color:white}
.nav-item.active{background:#5865F2;color:white}
.nav-item svg{width:16px;height:16px;flex-shrink:0}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column}
.topbar{padding:12px 20px;background:#16181f;border-bottom:1px solid #22252e;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-left{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#666}
.dot.starting{background:#f39c12;box-shadow:0 0 8px #f39c12;animation:pulse 1s infinite}
.dot.running{background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5}}
.state-text{font-size:.88rem;color:#8890a8}
.power-buttons{display:flex;gap:6px}
.pbtn{border:none;padding:8px 18px;border-radius:6px;font-size:.82rem;font-weight:700;color:white;cursor:pointer;font-family:inherit;transition:all .15s}
.pbtn-start{background:#2ecc71}.pbtn-start:hover{background:#27ae60}
.pbtn-restart{background:#f39c12}.pbtn-restart:hover{background:#e67e22}
.pbtn-stop{background:#e74c3c}.pbtn-stop:hover{background:#c0392b}
.pbtn:disabled{opacity:.4;cursor:not-allowed}

.panel{display:none}
.panel.active{display:block}

.console-grid{display:grid;grid-template-columns:1fr 340px;border-bottom:1px solid #22252e}
.console-left{display:flex;flex-direction:column;background:#000;height:520px;border-right:1px solid #22252e}
.terminal{flex:1;padding:16px;overflow-y:auto;font-family:'SF Mono','Monaco','Consolas',monospace;font-size:.82rem;line-height:1.55;color:#c8c8c8}
.terminal::-webkit-scrollbar{width:8px}
.terminal::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.tline{word-break:break-all}
.tline.info{color:#7d86ff}
.tline.ok{color:#2ecc71}
.tline.warn{color:#f39c12}
.tline.error{color:#e74c3c}
.command-line{display:flex;align-items:center;background:#0a0a0a;border-top:1px solid #222;padding:10px 16px;gap:8px;font-family:'SF Mono','Monaco','Consolas',monospace}
.command-line .prompt{color:#8890a8;font-size:.9rem}
.command-line input{flex:1;background:transparent;border:none;color:#e6e6e6;font-size:.85rem;font-family:inherit;outline:none}
.command-line input::placeholder{color:#444}

.info-area{display:flex;flex-direction:column;gap:12px;padding:16px;background:#0e1015;overflow-y:auto;height:520px}
.info-card{display:flex;align-items:center;gap:14px;background:#16181f;border:1px solid #22252e;border-radius:10px;padding:14px 18px}
.info-card .icon{width:40px;height:40px;border-radius:8px;background:#1f2230;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.info-card .label{font-size:.7rem;color:#666;text-transform:uppercase;letter-spacing:.05em}
.info-card .value{font-size:.95rem;font-weight:600;color:white;margin-top:2px}

.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:16px}
.chart-card{background:#16181f;border:1px solid #22252e;border-radius:10px;padding:16px}
.chart-title{font-size:.72rem;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.chart-card canvas{width:100%!important;height:120px!important}

.empty-page{padding:60px 40px;text-align:center;color:#666}
.empty-page .icon{font-size:4rem;margin-bottom:16px;opacity:.5}
.empty-page h3{margin:0 0 8px;color:#e6e6e6}

.files-wrap{padding:24px}
.files-toolbar{display:flex;gap:12px;margin-bottom:20px}
.btn-tool{border:none;padding:10px 20px;border-radius:8px;font-size:.9rem;font-weight:600;color:white;cursor:pointer;font-family:inherit}
.btn-newfolder{background:#5865F2}.btn-newfolder:hover{background:#4752c4}
.btn-upload{background:#2ecc71}.btn-upload:hover{background:#27ae60}
.file-row{display:grid;grid-template-columns:1fr 120px 80px;padding:14px 16px;border-bottom:1px solid #1a1d26;align-items:center}
.file-row:hover{background:#16181f}
.file-row .name{display:flex;align-items:center;gap:10px;color:white}
.file-row .size{color:#8890a8;font-size:.88rem}
.file-row .actions button{background:transparent;border:none;color:#666;cursor:pointer;padding:4px 8px;border-radius:6px}
.file-row .actions button:hover{color:#e74c3c;background:#2a1f22}
.total{text-align:right;padding:16px;color:#8890a8;font-size:.85rem}
.code-layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 130px)}
.code-sidebar{background:#0a0c12;border-right:1px solid #22252e;display:flex;flex-direction:column;overflow:hidden}
.code-header{padding:12px 16px;border-bottom:1px solid #22252e;display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.code-header .btn-tool{padding:4px 10px;font-size:.75rem;background:#5865F2;border:none;border-radius:6px;color:white;cursor:pointer;font-family:inherit}
.code-file-list{flex:1;overflow-y:auto;padding:8px}
.code-file-item{padding:8px 12px;border-radius:6px;cursor:pointer;color:#b8bcc8;font-size:.88rem;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-file-item:hover{background:#1f222b;color:white}
.code-file-item.active{background:#5865F2;color:white}
.code-main{display:flex;flex-direction:column;min-height:0}
.editor-toolbar{padding:10px 16px;border-bottom:1px solid #22252e;background:#16181f;display:flex;justify-content:space-between;align-items:center;font-size:.88rem}
.editor-toolbar #currentFileName{color:#8890a8}
.editor-toolbar .btn-tool{padding:6px 16px;background:#2ecc71;border:none;border-radius:6px;color:white;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600}
.editor-toolbar .btn-tool:disabled{opacity:.4;cursor:not-allowed;background:#666}

</style>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo"><a href="/dashboard">←</a> {{ server_name }}</div>
        <nav>
            <div class="nav-item active" onclick="showPanel('console', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                Console
            </div>
            <div class="nav-item" onclick="showPanel('ai', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>
                AI 助手
            </div>
            <div class="nav-item" onclick="showPanel('files', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                放資料夾
            </div>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="topbar-left">
                <span class="dot" id="statusDot"></span>
                <span class="state-text" id="stateText">離線</span>
            </div>
            <div class="power-buttons">
                <button class="pbtn pbtn-start" onclick="startServer()">Start</button>
                <button class="pbtn pbtn-restart" onclick="restartServer()">Restart</button>
                <button class="pbtn pbtn-stop" onclick="stopServer()">Stop</button>
            </div>
        </div>

        <!-- Console -->
        <div id="panel-console" class="panel active">
            <div class="console-grid">
                <div class="console-left">
                    <div class="terminal" id="terminal"></div>
                    <form class="command-line" onsubmit="sendCommand(event); return false;">
                        <span class="prompt">&raquo;</span>
                        <input type="text" id="cmdInput" placeholder="Type a command..." autocomplete="off">
                    </form>
                </div>
                <div class="info-area">
                    <div class="info-card"><div class="icon">🕐</div><div><div class="label">Uptime</div><div class="value" id="uptime">0h 0m 0s</div></div></div>
                    <div class="info-card"><div class="icon">📊</div><div><div class="label">CPU Load</div><div class="value" id="cpuVal">0.00% / ∞</div></div></div>
                    <div class="info-card"><div class="icon">💾</div><div><div class="label">Memory</div><div class="value" id="memVal">0 MiB / 512 MiB</div></div></div>
                    <div class="info-card"><div class="icon">💿</div><div><div class="label">Disk</div><div class="value" id="diskVal">0 MiB / 10 GiB</div></div></div>
                    <div class="info-card"><div class="icon">⬇️</div><div><div class="label">Network (Inbound)</div><div class="value" id="netIn">0 B</div></div></div>
                    <div class="info-card"><div class="icon">⬆️</div><div><div class="label">Network (Outbound)</div><div class="value" id="netOut">0 B</div></div></div>
                </div>
            </div>
            <div class="charts">
                <div class="chart-card"><div class="chart-title">CPU Load</div><canvas id="cpuChart"></canvas></div>
                <div class="chart-card"><div class="chart-title">Memory</div><canvas id="memChart"></canvas></div>
                <div class="chart-card"><div class="chart-title">Network</div><canvas id="netChart"></canvas></div>
            </div>
        </div>

        <!-- AI -->
        <div id="panel-ai" class="panel">
            <div class="empty-page">
                <div class="icon">🤖</div>
                <h3>AI 助手</h3>
                <p>功能開發中</p>
            </div>
        </div>

        <div id="panel-code" class="panel">
            <div class="code-layout">
                <aside class="code-sidebar">
                    <div class="code-header">
                        <strong>檔案</strong>
                        <button class="btn-tool" onclick="newCodeFile()">+ 新建</button>
                    </div>
                    <div id="codeFileList" class="code-file-list"></div>
                </aside>
                <main class="code-main">
                    <div class="editor-toolbar">
                        <span id="currentFileName">未開啟檔案</span>
                        <button class="btn-tool" id="saveCodeBtn" onclick="saveCode()" disabled>💾 儲存</button>
                    </div>
                    <div id="monacoEditor" style="flex:1;min-height:0"></div>
                </main>
            </div>
        </div>

        <!-- Files -->
        <div id="panel-files" class="panel">
            <div class="files-wrap">
                <div class="files-toolbar">
                    <button class="btn-tool btn-newfolder" onclick="newFolder()">📁 新增資料夾</button>
                    <button class="btn-tool btn-upload" onclick="document.getElementById('fileInput').click()">📤 上傳檔案</button>
                    <input type="file" id="fileInput" style="display:none" onchange="handleUpload(event)">
                </div>
                <div id="fileList"></div>
                <div class="total" id="totalSize"></div>
            </div>
        </div>
    </main>
</div>

<script>
const SERVER_NAME = {{ server_name|tojson }};
const STORAGE_KEY = 'botshop_files_' + SERVER_NAME;
let running = false, uptimeSeconds = 0, uptimeTimer = null, statsTimer = null;

function showPanel(id, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    el.classList.add('active');
    if (id === 'files') renderFiles();
    if (id === 'console') document.getElementById('cmdInput').focus();
    if (id === 'code') loadCodeFiles();
}

const term = document.getElementById('terminal');
function tlog(text, cls) {
    const d = document.createElement('div');
    d.className = 'tline ' + (cls || '');
    d.textContent = text;
    term.appendChild(d);
    while (term.children.length > 500) {
        term.removeChild(term.firstChild);
    }
    term.scrollTop = term.scrollHeight;
    // 存 localStorage
    try {
        const saved = JSON.parse(localStorage.getItem('botshop_console') || '[]');
        saved.push({text, cls});
        if (saved.length > 500) saved.splice(0, saved.length - 500);
        localStorage.setItem('botshop_console', JSON.stringify(saved));
    } catch(e) {}
}

function restoreConsole() {
    try {
        const saved = JSON.parse(localStorage.getItem('botshop_console') || '[]');
        for (const item of saved) {
            const d = document.createElement('div');
            d.className = 'tline ' + (item.cls || '');
            d.textContent = item.text;
            term.appendChild(d);
        }
        if (saved.length) term.scrollTop = term.scrollHeight;
    } catch(e) {}
}
function tlogSeq(lines, classes, delay, onDone) {
    let i = 0;
    const t = setInterval(() => {
        tlog(lines[i], classes[i] || '');
        i++;
        if (i >= lines.length) { clearInterval(t); if (onDone) onDone(); }
    }, delay);
    return new Promise(resolve => {
        const check = setInterval(() => {
            if (i >= lines.length) { clearInterval(check); resolve(); }
        }, 50);
    });
}
function setButtons(d) { document.querySelectorAll('.pbtn').forEach(b => b.disabled = d); }
function setDot(state) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('stateText');
    if (!dot) return;
    dot.classList.remove('offline', 'starting', 'running');
    dot.classList.add(state);
    txt.textContent = state === 'running' ? '線上' : state === 'starting' ? '啟動中' : '離線';
}

function fmtUptime(s) {
    return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm ' + (s%60) + 's';
}
function startUptime() {
    if (uptimeTimer) return;
    uptimeSeconds = 0;
    uptimeTimer = setInterval(() => {
        uptimeSeconds++;
        document.getElementById('uptime').textContent = fmtUptime(uptimeSeconds);
    }, 1000);
}
function stopUptime() { if (uptimeTimer) { clearInterval(uptimeTimer); uptimeTimer = null; } }

let cpuChart, memChart, netChart;
function initCharts() {
    const opts = {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { display: false }, y: { beginAtZero: true, grid: { color: '#1a1d26' }, ticks: { color: '#666', font: { size: 9 } } } },
        animation: false,
        elements: { line: { borderColor: '#00d9ff', borderWidth: 2, tension: 0.3 }, point: { radius: 0 } }
    };
    const mk = id => new Chart(document.getElementById(id), {
        type: 'line',
        data: { labels: Array(30).fill(''), datasets: [{ data: Array(30).fill(0), borderColor: '#00d9ff', backgroundColor: 'rgba(0,217,255,0.05)', fill: true }] },
        options: opts
    });
    cpuChart = mk('cpuChart'); memChart = mk('memChart'); netChart = mk('netChart');
}
function pushData(c, v) { c.data.datasets[0].data.push(v); c.data.datasets[0].data.shift(); c.update('none'); }


let lastLogId = 0;
let consolePolling = null;

function stripAnsi(str) {
    return str.replace(/\x1b\[[0-9;]*m/g, '');
}

function shouldSkip(line) {
    const t = line.trim();
    const skipPrefixes = [
        '[Pterodactyl Daemon]:',
        'Requirement already satisfied:',
        'container~ sh -c',
        'Defaulting to user installation',
        'Pulling from ',
        'Status: Image is up to date',
        'Digest: sha256:',
    ];
    for (const p of skipPrefixes) {
        if (t.startsWith(p)) return true;
    }
    // 過濾「[Scheduler] xxx 已停止 (exit X)」
    if (/^\[Scheduler\] .+ 已停止 \(exit/.test(t)) return true;
    return false;
}

let lastLine = '';



async function checkBotStatus() {
    try {
        const res = await fetch('/api/console/recent?since_id=0');
        const d = await res.json();
        if (!d.ok) return;
        
        let latestStatus = 'unknown';
        let latestBotName = '';
        
        // 從最新往回找
        for (let i = d.lines.length - 1; i >= 0; i--) {
            const line = stripAnsi(d.lines[i].line);
            const m = line.match(/已登录[:：]\s*(.+)/);
            if (m) {
                latestBotName = m[1].trim();
                latestStatus = 'running';
                break;
            }
            if (line.includes('已停止') || line.includes('Server marked as offline')) {
                latestStatus = 'stopped';
                break;
            }
        }
        
        // 更新狀態燈
        if (latestStatus === 'running') {
            setDot('running');
        } else if (latestStatus === 'stopped') {
            setDot('offline');
        }
        
        // 更新「等待指令...」文字
        if (latestBotName) {
            const children = Array.from(term.children);
            for (let i = children.length - 1; i >= 0; i--) {
                if (children[i].textContent.includes('等待指令')) {
                    children[i].textContent = 'BotShop@BotShop~ $ 已啟動：' + latestBotName;
                    children[i].className = 'tline ok';
                    break;
                }
            }
        }
    } catch(e) {
        console.error('checkBotStatus', e);
    }
}

async function loadRecentLogs() {
    try {
        const res = await fetch('/api/console/recent?since_id=0');
        const d = await res.json();
        if (!d.ok) return;
        // 取最後 50 筆
        const lines = d.lines.slice(-500);
        for (const row of lines) {
            let line = stripAnsi(row.line);
            lastLogId = Math.max(lastLogId, row.id);
            if (shouldSkip(line)) continue;
            tlog(line);
            lastLine = line;
        }
    } catch(e) {
        console.error('loadRecentLogs', e);
    }
}

function startConsolePolling() {
    if (consolePolling) return;
    consolePolling = setInterval(async () => {
        try {
            const res = await fetch('/api/console/recent?since_id=' + lastLogId);
            const d = await res.json();
            if (!d.ok) return;
            for (const row of d.lines) {
                let line = stripAnsi(row.line);
                lastLogId = Math.max(lastLogId, row.id);
                if (shouldSkip(line)) continue;
                if (line === lastLine) continue;
                tlog(line);
                lastLine = line;

                // 偵測機器人啟動成功
                const m = line.match(/已登录[:：]\s*(.+)/);
                if (m) {
                    tlog('✅ 已啟動：' + m[1].trim(), 'ok');
                }
                // 偵測崩潰 / 錯誤
                if (line.includes('Traceback (most recent call last)')) {
                    tlog('⚠️ 機器人崩潰', 'error');
                }
                if (line.match(/Error:|Exception:|ImportError:|SyntaxError:/)) {
                    tlog('❌ ' + line.trim(), 'error');
                }
                if (line.includes('已停止')) {
                    tlog('⏸️ 機器人已停止', 'warn');
                }
            }
        } catch(e) {}
    }, 2000);
}

function startStats() {
    if (statsTimer) return;
    statsTimer = setInterval(() => {
        const cpu = Math.random() * 0.1;
        const mem = 40 + Math.random() * 5;
        const nIn = Math.random() * 50;
        const nOut = Math.random() * 30;
        document.getElementById('cpuVal').textContent = cpu.toFixed(2) + '% / ∞';
        document.getElementById('memVal').textContent = mem.toFixed(2) + ' MiB / 512 MiB';
        document.getElementById('diskVal').textContent = '36.76 MiB / 10 GiB';
        document.getElementById('netIn').textContent = nIn.toFixed(2) + ' KiB';
        document.getElementById('netOut').textContent = nOut.toFixed(2) + ' KiB';
        pushData(cpuChart, cpu);
        pushData(memChart, mem);
        pushData(netChart, nIn + nOut);
    }, 1000);
}
function stopStats() { if (statsTimer) { clearInterval(statsTimer); statsTimer = null; } }

async function startServer() {
    if (running) return;
    setButtons(true);
    setDot('starting');

    await new Promise(resolve => {
        tlogSeq([
            '[BotShop Daemon]: ---------- 正在拉取 Docker 容器映像檔 ----------',
            '[BotShop Daemon]: 已完成拉取 Docker 容器映像檔',
            '[BotShop Daemon]: ---------- 環境變數 ----------',
            '[BotShop Daemon]: 更新伺服器資源',
            'BotShop@BotShop~ $ Server marked as starting...',
            "BotShop@BotShop~ $ bash -c 'cd /home/container && python3 botshop.py'"
        ], ['', '', '', '', 'info', 'info'], 550, resolve);
    });

    const files = getFiles();
    const codeFiles = files.filter(f => f.type === 'file' && (f.name.endsWith('.py') || f.name.endsWith('.js')));
    if (codeFiles.length === 0) {
        await new Promise(resolve => {
            tlogSeq([
                "python3: can't open file '/home/container/botshop.py': [Errno 2] No such file or directory",
                'BotShop@BotShop~ $ Server marked as offline...',
                '[BotShop Daemon]: ---------- 偵測到伺服器處理程序處於當機狀態！ ----------',
                '[BotShop Daemon]: 結束代碼：2',
                '[BotShop Daemon]: 已中止自動重新啟動，上一次啟動失敗'
            ], ['error', 'error', 'error', 'error', 'error'], 550, resolve);
        });
        setButtons(false);
        setDot('offline');
        return;
    }

    try {
        const res = await fetch('/api/server/start', {method: 'POST'});
        const d = await res.json();
        if (!d.ok) { alert('失敗：' + (d.msg || '未知')); setButtons(false); setDot('offline'); return; }
        pollJob(d.job_id, 'start');
    } catch(e) {
        alert('錯誤：' + e);
        setButtons(false);
        setDot('offline');
    }
}
async function stopServer() {
    if (!running) return;
    setButtons(true);
    running = false;
    setDot('offline');
    stopUptime();
    stopStats();
    document.getElementById('uptime').textContent = '0h 0m 0s';
    document.getElementById('cpuVal').textContent = '0.00% / ∞';
    document.getElementById('memVal').textContent = '0 MiB / 512 MiB';
    document.getElementById('diskVal').textContent = '0 MiB / 10 GiB';
    document.getElementById('netIn').textContent = '0 B';
    document.getElementById('netOut').textContent = '0 B';
    if (cpuChart) { cpuChart.data.datasets[0].data = Array(30).fill(0); cpuChart.update('none'); }
    if (memChart) { memChart.data.datasets[0].data = Array(30).fill(0); memChart.update('none'); }
    if (netChart) { netChart.data.datasets[0].data = Array(30).fill(0); netChart.update('none'); }
    try {
        const res = await fetch('/api/server/stop', {method: 'POST'});
        const d = await res.json();
        if (!d.ok) { alert('失敗：' + (d.msg || '未知')); }
    } catch(e) {
        alert('錯誤：' + e);
    }
    setButtons(false);
}
async function restartServer() {
    setButtons(true);
    try {
        const res = await fetch('/api/server/restart', {method: 'POST'});
        const d = await res.json();
        if (!d.ok) { alert('失敗：' + (d.msg || '未知')); setButtons(false); return; }
        tlog('BotShop@BotShop~ $ Server marked as restarting...', 'warn');
        pollJob(d.job_id, 'restart');
    } catch(e) { alert('錯誤：' + e); setButtons(false); }
}

async function pollJob(jobId, kind) {
    try {
        const res = await fetch('/api/server/status/' + jobId);
        const d = await res.json();
        if (!d.ok) { setButtons(false); setDot('offline'); return; }
        const j = d.job;
        if (j.status === 'pending' || j.status === 'running') {
            setTimeout(() => pollJob(jobId, kind), 3000);
            return;
        }
        if (j.status === 'done') {
            if (kind === 'start' || kind === 'restart') {
                tlog("BotShop@BotShop~ $ bash -c 'cd /home/container && python3 bot.py'", 'info');
                tlog('Python 3.13.15', '');
                tlog('logged in as botshop (running)', 'ok');
                tlog('BotShop@BotShop~ $ Server marked as running...', 'ok');
                running = true;
                setDot('running');
                startUptime();
                startStats();
            } else {
                tlog('[BotShop Daemon]: 伺服器已停止', 'ok');
                tlog('BotShop@BotShop~ $ Server marked as offline...', 'ok');
                running = false;
                setDot('offline');
                stopUptime();
                stopStats();
                document.getElementById('uptime').textContent = '0h 0m 0s';
                document.getElementById('cpuVal').textContent = '0.00% / ∞';
                document.getElementById('memVal').textContent = '0 MiB / 512 MiB';
                document.getElementById('netIn').textContent = '0 B';
                document.getElementById('netOut').textContent = '0 B';
            }
        } else {
            tlog("python3: can't open file '/home/container/bot.py': [Errno 2] No such file or directory", 'error');
            tlog('BotShop@BotShop~ $ Server marked as offline...', 'error');
            tlog('[BotShop Daemon]: ---------- 偵測到伺服器處理程序處於當機狀態！ ----------', 'error');
            tlog('[BotShop Daemon]: 結束代碼：2', 'error');
            running = false;
            setDot('offline');
        }
        setButtons(false);
    } catch(e) { setButtons(false); }
}

async function sendCommand(e) {
    e.preventDefault();
    const input = document.getElementById('cmdInput');
    const cmd = input.value.trim();
    if (!cmd) return;
    input.value = '';
    tlog('> ' + cmd, 'cmd');

    if (cmd === 'clear') { term.innerHTML = ''; return; }
    if (cmd === 'help') {
        tlog('本地: clear, help', 'info');
        tlog('其他指令會送到 Pterodactyl（例如 ls, pip install xxx, python3 xxx.py）', 'info');
        return;
    }

    try {
        const res = await fetch('/api/server/command', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({command: cmd})
        });
        const d = await res.json();
        if (!d.ok) { tlog('[Send] ❌ ' + (d.msg || '未知'), 'error'); return; }
        tlog('[Send] ✅ 已送出指令', 'ok');
        pollJob(d.job_id, 'command');
    } catch(err) {
        tlog('[Send] ❌ ' + err, 'error');
    }
}

async function pollCommandJob(jobId) {
    try {
        const res = await fetch('/api/server/status/' + jobId);
        const d = await res.json();
        if (!d.ok) return;
        const j = d.job;
        if (j.status === 'pending' || j.status === 'running') {
            setTimeout(() => pollCommandJob(jobId), 1000);
            return;
        }
        if (j.status === 'done') {
            tlog('[Send] ✅ 指令已送達 Pterodactyl（' + (j.result || '') + '）', 'ok');
        } else {
            tlog('[Send] ❌ 送指令失敗：' + (j.result || '未知'), 'error');
        }
    } catch(e) {}
}

function getFiles() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; } }
function saveFiles(a) { localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }
function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
}
function renderFiles() {
    const list = document.getElementById('fileList');
    const total = document.getElementById('totalSize');
    const files = getFiles();
    if (!files.length) {
        list.innerHTML = '<div style="text-align:center;padding:60px;color:#666">還沒有任何檔案</div>';
        total.textContent = '';
        return;
    }
    list.innerHTML = files.map((f, i) => '<div class="file-row"><div class="name">' + (f.type === 'folder' ? '📁' : '📄') + ' ' + f.name + '</div><div class="size">' + (f.type === 'folder' ? '—' : fmtSize(f.size)) + '</div><div class="actions"><button onclick="deleteFile(' + i + ')">✕</button></div></div>').join('');
    const sum = files.reduce((s, f) => s + (f.size || 0), 0);
    total.textContent = '共 ' + files.length + ' 個項目 · ' + fmtSize(sum);
}
function newFolder() {
    const name = prompt('資料夾名稱：');
    if (!name || !name.trim()) return;
    const files = getFiles();
    files.push({ type: 'folder', name: name.trim(), size: 0 });
    saveFiles(files); renderFiles();
}
async function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.endsWith('.py') && !file.name.endsWith('.js')) {
        alert('❌ 只接受 .py 或 .js 檔案');
        e.target.value = '';
        return;
    }
    const reader = new FileReader();
    reader.onload = async () => {
        const b64 = reader.result.split(",")[1];
        try {
            const res = await fetch('/api/files/upload', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({filename: file.name, content: b64})
            });
            const d = await res.json();
            if (!d.ok) { alert('上傳失敗：' + (d.msg || '未知')); return; }
            const files = getFiles();
            files.push({type: 'file', name: file.name, size: file.size});
            saveFiles(files);
            renderFiles();
            tlog('[Upload] ✅ ' + file.name + ' 已上傳，bot 正在寫入 Pterodactyl...', 'ok');
            pollUploadJob(d.job_id, file.name);
        } catch(err) {
            alert('上傳錯誤：' + err);
        }
    };
    reader.readAsDataURL(file);
    e.target.value = '';
}

async function pollUploadJob(jobId, filename) {
    try {
        const res = await fetch('/api/server/status/' + jobId);
        const d = await res.json();
        if (!d.ok) return;
        const j = d.job;
        if (j.status === 'pending' || j.status === 'running') {
            setTimeout(() => pollUploadJob(jobId, filename), 1500);
            return;
        }
        if (j.status === 'done') {
            tlog('[Upload] ✅ ' + filename + ' 已寫入 Pterodactyl（' + (j.result || '') + '）', 'ok');
        } else {
            tlog('[Upload] ❌ ' + filename + ' 寫入失敗：' + (j.result || '未知'), 'error');
        }
    } catch(e) {}
}
function deleteFile(i) {
    if (!confirm('刪除？')) return;
    const files = getFiles();
    files.splice(i, 1);
    saveFiles(files); renderFiles();
}

initCharts();
restoreConsole();

loadRecentLogs().then(() => { checkBotStatus(); startConsolePolling(); });
setDot('offline');
setTimeout(() => tlog('BotShop@BotShop~ $ 等待指令...', 'info'), 500);
</script>
