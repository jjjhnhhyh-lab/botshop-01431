<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>{{ server_name }} - BotShop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0e1015;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#16181f;border-right:1px solid #22252e;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0}
.sidebar .logo{padding:16px 20px;font-weight:700;font-size:1.02rem;border-bottom:1px solid #22252e;display:flex;align-items:center;gap:8px}
.sidebar .logo a{color:#8890a8;text-decoration:none;font-size:0.85rem;font-weight:400;margin-right:4px}
.sidebar .logo a:hover{color:white}
.sidebar nav{flex:1;padding:10px 8px;overflow-y:auto}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#b8bcc8;font-size:0.88rem;cursor:pointer;margin-bottom:2px;transition:all .15s}
.sidebar .nav-item:hover{background:#1f222b;color:white}
.sidebar .nav-item.active{background:#5865F2;color:white}
.sidebar .nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar .section-label{padding:12px 12px 6px;font-size:0.68rem;color:#666;text-transform:uppercase;letter-spacing:0.06em}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column}
.topbar{padding:12px 20px;background:#16181f;border-bottom:1px solid #22252e;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-left{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#666;transition:all .3s}
.dot.starting{background:#f39c12;box-shadow:0 0 8px #f39c12;animation:pulse 1s ease-in-out infinite}
.dot.running{background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.state-text{font-size:0.88rem;color:#8890a8}
.power-buttons{display:flex;gap:6px}
.pbtn{border:none;padding:8px 18px;border-radius:6px;font-size:0.82rem;font-weight:700;color:white;cursor:pointer;transition:all .15s;font-family:inherit}
.pbtn-start{background:#2ecc71}.pbtn-start:hover{background:#27ae60}
.pbtn-restart{background:#f39c12}.pbtn-restart:hover{background:#e67e22}
.pbtn-stop{background:#e74c3c}.pbtn-stop:hover{background:#c0392b}
.pbtn-kill{background:#34495e}.pbtn-kill:hover{background:#2c3e50}
.pbtn:disabled{opacity:.4;cursor:not-allowed}

.panel{display:none;flex:1}
.panel.active{display:block}

.console-grid{display:grid;grid-template-columns:1fr 340px;border-bottom:1px solid #22252e}
.console-left{display:flex;flex-direction:column;background:#000;height:520px;border-right:1px solid #22252e}
.terminal{flex:1;padding:16px;overflow-y:auto;font-family:'SF Mono','Monaco','Consolas',monospace;font-size:0.82rem;line-height:1.55;color:#c8c8c8}
.terminal::-webkit-scrollbar{width:8px}
.terminal::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.tline{word-break:break-all}
.tline.info{color:#7d86ff}
.tline.ok{color:#2ecc71}
.tline.warn{color:#f39c12}
.tline.error{color:#e74c3c}
.command-line{display:flex;align-items:center;background:#0a0a0a;border-top:1px solid #222;padding:10px 16px;gap:8px;font-family:'SF Mono','Monaco','Consolas',monospace}
.command-line .prompt{color:#8890a8;font-size:0.9rem}
.command-line input{flex:1;background:transparent;border:none;color:#e6e6e6;font-size:0.85rem;font-family:inherit;outline:none}
.command-line input::placeholder{color:#444}

.info-area{display:flex;flex-direction:column;gap:12px;padding:16px;background:#0e1015;overflow-y:auto;height:520px}
.info-card{display:flex;align-items:center;gap:14px;background:#16181f;border:1px solid #22252e;border-radius:10px;padding:14px 18px}
.info-card .icon{width:40px;height:40px;border-radius:8px;background:#1f2230;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.info-card .label{font-size:0.7rem;color:#666;text-transform:uppercase;letter-spacing:0.05em}
.info-card .value{font-size:0.95rem;font-weight:600;color:white;margin-top:2px}

.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:16px}
.chart-card{background:#16181f;border:1px solid #22252e;border-radius:10px;padding:16px}
.chart-title{font-size:0.72rem;color:#666;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}
.chart-card canvas{width:100%!important;height:120px!important}

.empty-page{padding:60px 40px;text-align:center;color:#666}
.empty-page .icon{font-size:4rem;margin-bottom:16px;opacity:.5}
.empty-page h3{margin:0 0 8px;color:#e6e6e6}
.empty-page p{margin:0;font-size:0.9rem}

.files-wrap{padding:24px}
.files-toolbar{display:flex;gap:12px;margin-bottom:20px}
.btn-tool{border:none;padding:10px 20px;border-radius:8px;font-size:0.9rem;font-weight:600;color:white;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-newfolder{background:#5865F2}.btn-newfolder:hover{background:#4752c4}
.btn-upload{background:#2ecc71}.btn-upload:hover{background:#27ae60}
.file-row{display:grid;grid-template-columns:1fr 120px 80px;padding:14px 16px;border-bottom:1px solid #1a1d26;align-items:center}
.file-row:hover{background:#16181f}
.file-row .name{display:flex;align-items:center;gap:10px;color:white}
.file-row .size{color:#8890a8;font-size:0.88rem}
.file-row .actions button{background:transparent;border:none;color:#666;cursor:pointer;padding:4px 8px;border-radius:6px}
.file-row .actions button:hover{color:#e74c3c;background:#2a1f22}
.total{text-align:right;padding:16px;color:#8890a8;font-size:0.85rem}
</style>
</head>
<body>
