<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>{{ server_name }} - BotShop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #0a0c12;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
}

/* 頂部 bar */
.server-bar {
    background: #16181f;
    border-bottom: 1px solid #22252e;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.server-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.05rem;
}
.dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 8px #2ecc71;
    animation: pulse 2s ease-in-out infinite;
}
.dot.offline { background: #666; box-shadow: none; animation: none; }
@keyframes pulse { 50% { opacity: 0.5; } }

.power-buttons { display: flex; gap: 6px; }
.pbtn {
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    color: white;
    transition: all 0.15s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.pbtn-start { background: #2ecc71; }
.pbtn-start:hover { background: #27ae60; }
.pbtn-restart { background: #f39c12; }
.pbtn-restart:hover { background: #e67e22; }
.pbtn-stop { background: #e74c3c; }
.pbtn-stop:hover { background: #c0392b; }
.pbtn-kill { background: #34495e; }
.pbtn-kill:hover { background: #2c3e50; }

.back-link {
    color: #8890a8;
    text-decoration: none;
    font-size: 0.85rem;
    margin-right: 16px;
}
.back-link:hover { color: white; }

/* Tabs */
.tabs {
    display: flex;
    background: #0f1116;
    border-bottom: 1px solid #22252e;
    padding: 0 24px;
}
.tab {
    padding: 12px 20px;
    background: transparent;
    color: #8890a8;
    border: none;
    border-bottom: 2px solid transparent;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.tab:hover { color: white; }
.tab.active {
    color: white;
    border-bottom-color: #5865F2;
}

.panel { display: none; }
.panel.active { display: block; }

/* Console (Pterodactyl style) */
.console-wrap {
    height: calc(100vh - 130px);
    display: flex;
    flex-direction: column;
}
.terminal {
    flex: 1;
    background: #000;
    padding: 16px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace;
    font-size: 0.85rem;
    overflow-y: auto;
    line-height: 1.55;
    color: #c8c8c8;
}
.terminal::-webkit-scrollbar { width: 8px; }
.terminal::-webkit-scrollbar-track { background: #0a0a0a; }
.terminal::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

.tline { word-break: break-all; }
.tline.info { color: #7d86ff; }
.tline.ok { color: #2ecc71; }
.tline.warn { color: #f39c12; }
.tline.error { color: #e74c3c; }
.tline.cmd { color: #fff; }
.tline.cmd::before {
    content: '$ ';
    color: #2ecc71;
}

.command-line {
    display: flex;
    align-items: center;
    background: #0a0a0a;
    border-top: 1px solid #222;
    padding: 10px 16px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    gap: 8px;
}
.command-line .prompt { color: #2ecc71; font-size: 0.9rem; }
.command-line input {
    flex: 1;
    background: transparent;
    border: none;
    color: #e6e6e6;
    font-size: 0.88rem;
    font-family: inherit;
    outline: none;
    padding: 4px 0;
}
.command-line input::placeholder { color: #444; }

/* AI 助手 */
.ai-wrap { padding: 40px 24px; }
.ai-box {
    background: #181b22;
    border: 1px solid #262a33;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
}
.ai-box .icon { font-size: 4rem; margin-bottom: 16px; }
.ai-box h3 { margin: 0 0 8px; }
.ai-box p { color: #8890a8; margin: 0; }

/* 檔案管理 */
.files-wrap { padding: 24px; }
.files-toolbar { display: flex; gap: 12px; margin-bottom: 20px; }
.btn-newfolder, .btn-upload {
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: white;
    transition: all 0.2s;
    font-family: inherit;
}
.btn-newfolder { background: #5865F2; }
.btn-newfolder:hover { background: #4752c4; }
.btn-upload { background: #2ecc71; }
.btn-upload:hover { background: #27ae60; }

.files-header, .file-row {
    display: grid;
    grid-template-columns: 1fr 120px 80px;
    padding: 12px 16px;
    align-items: center;
}
.files-header {
    border-bottom: 1px solid #22252e;
    font-size: 0.78rem;
    color: #666;
    text-transform: uppercase;
}
.file-row {
    border-bottom: 1px solid #1a1d26;
    transition: background 0.15s;
}
.file-row:hover { background: #16181f; }
.file-row .name { display: flex; align-items: center; gap: 10px; color: white; }
.file-row .size { color: #8890a8; font-size: 0.88rem; }
.file-row .actions button {
    background: transparent;
    color: #666;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
}
.file-row .actions button:hover { color: #e74c3c; background: #2a1f22; }

.empty-files {
    text-align: center;
    padding: 60px 20px;
    color: #666;
}
.empty-files .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
.total { text-align: right; padding: 16px; color: #8890a8; font-size: 0.85rem; }
</style>
</head>
<body>

<div class="server-bar">
    <div class="server-name">
        <a href="/dashboard" class="back-link">← 返回</a>
        <span class="dot" id="statusDot"></span>
        <span id="serverName">{{ server_name }}</span>
    </div>
    <div class="power-buttons">
        <button class="pbtn pbtn-start" onclick="startServer()">▶ Start</button>
        <button class="pbtn pbtn-restart" onclick="restartServer()">↻ Restart</button>
        <button class="pbtn pbtn-stop" onclick="stopServer()">■ Stop</button>
        <button class="pbtn pbtn-kill" onclick="killServer()">✖ Kill</button>
    </div>
</div>

<div class="tabs">
    <button class="tab active" onclick="showTab('console', this)">Console</button>
    <button class="tab" onclick="showTab('ai', this)">AI 助手</button>
    <button class="tab" onclick="showTab('files', this)">放資料夾</button>
</div>

<!-- Console -->
<div id="panel-console" class="panel active">
    <div class="console-wrap">
        <div class="terminal" id="terminal"></div>
        <form class="command-line" onsubmit="sendCommand(event)">
            <span class="prompt">$</span>
            <input type="text" id="cmdInput" placeholder="輸入指令..." autocomplete="off" autofocus>
        </form>
    </div>
</div>

<!-- AI -->
<div id="panel-ai" class="panel">
    <div class="ai-wrap">
        <div class="ai-box">
            <div class="icon">🤖</div>
            <h3>AI 助手</h3>
            <p>功能開發中</p>
        </div>
    </div>
</div>

<!-- Files -->
<div id="panel-files" class="panel">
    <div class="files-wrap">
        <div class="files-toolbar">
            <button class="btn-newfolder" onclick="newFolder()">📁 新增資料夾</button>
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📤 上傳檔案</button>
            <input type="file" id="fileInput" style="display:none" onchange="handleUpload(event)">
        </div>
        <div class="files-header">
            <div>名稱</div>
            <div>大小</div>
            <div></div>
        </div>
        <div id="fileList"></div>
        <div class="total" id="totalSize"></div>
    </div>
</div>

<script>
const SERVER_NAME = {{ server_name|tojson }};
const STORAGE_KEY = 'botshop_files_' + SERVER_NAME;
let running = false;

function showTab(id, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    el.classList.add('active');
    if (id === 'files') renderFiles();
    if (id === 'console') document.getElementById('cmdInput').focus();
}

// ── Terminal ──
const term = document.getElementById('terminal');

function tlog(text, cls = '') {
    const div = document.createElement('div');
    div.className = 'tline ' + cls;
    div.textContent = text;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
}

function setRunning(state) {
    running = state;
    const dot = document.getElementById('statusDot');
    if (state) dot.classList.remove('offline');
    else dot.classList.add('offline');
}

// ── 啟動/停止/重啟 ──
function startServer() {
    if (running) { tlog('伺服器已在運行中', 'warn'); return; }
    const files = getFiles();
    if (files.length === 0) {
        tlog('✗ 錯誤：伺服器內沒有任何檔案，無法啟動', 'error');
        tlog('✗ 請先到「放資料夾」上傳檔案或新增資料夾', 'error');
        return;
    }
    tlog('> 正在啟動伺服器...', 'info');
    setTimeout(() => {
        setRunning(true);
        tlog('✓ 伺服器已啟動', 'ok');
        tlog('  botshop@botshop:~$ 等待指令...', 'info');
    }, 1000);
}

function stopServer() {
    if (!running) { tlog('伺服器未在運行', 'warn'); return; }
    tlog('> 正在停止伺服器...', 'warn');
    setTimeout(() => {
        setRunning(false);
        tlog('✓ 伺服器已停止', 'ok');
    }, 800);
}

function restartServer() {
    const files = getFiles();
    if (files.length === 0) {
        tlog('✗ 錯誤：伺服器內沒有任何檔案，無法重啟', 'error');
        tlog('✗ 請先到「放資料夾」上傳檔案或新增資料夾', 'error');
        return;
    }
    tlog('> 正在重啟伺服器...', 'info');
    setTimeout(() => {
        setRunning(true);
        tlog('✓ 伺服器已重啟', 'ok');
    }, 1000);
}

function killServer() {
    tlog('> 強制終止伺服器...', 'error');
    setTimeout(() => {
        setRunning(false);
        tlog('✓ 伺服器已強制終止', 'ok');
    }, 500);
}

// ── 指令輸入 ──
function sendCommand(e) {
    e.preventDefault();
    const input = document.getElementById('cmdInput');
    const cmd = input.value.trim();
    if (!cmd) return;
    input.value = '';
    tlog('$ ' + cmd, 'cmd');

    // 簡單指令處理
    const parts = cmd.split(/\s+/);
    const c = parts[0].toLowerCase();

    switch (c) {
        case 'help':
            tlog('可用指令：', 'info');
            tlog('  help        顯示幫助', 'info');
            tlog('  ls          列出檔案', 'info');
            tlog('  clear       清空終端機', 'info');
            tlog('  whoami      顯示目前使用者', 'info');
            tlog('  date        顯示時間', 'info');
            break;
        case 'ls': {
            const files = getFiles();
            if (files.length === 0) tlog('（空）', 'info');
            else files.forEach(f => tlog('  ' + (f.type === 'folder' ? '📁 ' : '📄 ') + f.name, 'info'));
            break;
        }
        case 'clear':
            term.innerHTML = '';
            break;
        case 'whoami':
            tlog('botshop', 'ok');
            break;
        case 'date':
            tlog(new Date().toString(), 'info');
            break;
        default:
            tlog('command not found: ' + c, 'error');
    }
}

// ── 檔案管理 ──
function getFiles() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
}
function saveFiles(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
    return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}
function renderFiles() {
    const list = document.getElementById('fileList');
    const total = document.getElementById('totalSize');
    const files = getFiles();
    if (files.length === 0) {
        list.innerHTML = '<div class="empty-files"><div class="icon">📂</div><p>還沒有任何檔案</p><p style="font-size:.85em;opacity:.7">點「上傳檔案」開始</p></div>';
        total.textContent = '';
        return;
    }
    list.innerHTML = files.map((f, i) => `
        <div class="file-row">
            <div class="name"><span>${f.type === 'folder' ? '📁' : '📄'}</span><span>${f.name}</span></div>
            <div class="size">${f.type === 'folder' ? '—' : fmtSize(f.size)}</div>
            <div class="actions"><button onclick="deleteFile(${i})">✕</button></div>
        </div>
    `).join('');
    const sum = files.reduce((s, f) => s + (f.size || 0), 0);
    total.textContent = '共 ' + files.length + ' 個項目 · ' + fmtSize(sum);
}
function newFolder() {
    const name = prompt('資料夾名稱：');
    if (!name || !name.trim()) return;
    const files = getFiles();
    files.push({ type: 'folder', name: name.trim(), size: 0 });
    saveFiles(files);
    renderFiles();
}
function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const files = getFiles();
    files.push({ type: 'file', name: file.name, size: file.size });
    saveFiles(files);
    renderFiles();
    e.target.value = '';
}
function deleteFile(i) {
    if (!confirm('確定刪除？')) return;
    const files = getFiles();
    files.splice(i, 1);
    saveFiles(files);
    renderFiles();
}

// 初始化
tlog('Welcome to ' + SERVER_NAME + ' console', 'ok');
tlog('連接中...', 'info');
setTimeout(() => {
    tlog('✓ 已連接', 'ok');
    tlog('輸入 help 查看可用指令', 'info');
}, 500);
</script>

</body>
</html>
