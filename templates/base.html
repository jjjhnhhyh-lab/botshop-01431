<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>{{ shop }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
body{background:#0f1116;color:#e6e6e6;margin:0}
a{color:#7d86ff;text-decoration:none}
</style>
</head>
<body>
<main class="container">
{% with m=get_flashed_messages() %}{% for x in m %}
<article>{{ x }}</article>
{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>
