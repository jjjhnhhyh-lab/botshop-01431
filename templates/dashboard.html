{% extends "base.html" %}
{% block body %}
<style>
.welcome { text-align: center; margin: 15vh auto; max-width: 600px; }
.welcome .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
    border: 3px solid #5865F2;
}
.welcome .avatar-default {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: #5865F2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5em;
    font-weight: 700;
    color: white;
    margin-bottom: 1rem;
    border: 3px solid #5865F2;
}
.welcome h2 { margin: 0.5rem 0 0.2rem; }
.welcome .handle { opacity: 0.6; margin-bottom: 3rem; }
.btn-logout {
    display: inline-block;
    background: transparent;
    color: #a0a4b8;
    padding: 12px 28px;
    border: 1px solid #2a2e3a;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.2s;
}
.btn-logout:hover {
    background: #1a1d26;
    border-color: #e74c3c;
    color: #e74c3c;
}
</style>

<div class="welcome">
    {% if user.avatar %}
        <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png?size=128" class="avatar" alt="">
    {% else %}
        <div class="avatar-default">{{ user.global_name[0] }}</div>
    {% endif %}
    <h2>歡迎，{{ user.global_name }}</h2>
    <p class="handle">@{{ user.username }}</p>
    <a href="/auth/logout" class="btn-logout">登出</a>
</div>
{% endblock %}
