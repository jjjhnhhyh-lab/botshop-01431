{% extends "base.html" %}
{% block body %}
<style>
body { margin: 0; }
.layout { display: flex; min-height: 100vh; }
.sidebar {
    width: 260px;
    background: #16181f;
    border-right: 1px solid #22252e;
    display: flex;
    flex-direction: column;
    padding: 20px 12px;
    position: fixed;
    top: 0; bottom: 0; left: 0;
}
.logo {
    padding: 12px 16px;
    font-size: 1.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #5865F2, #EB459E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
}
.nav { flex: 1; }
.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    color: #b8bcc8;
    text-decoration: none;
    margin-bottom: 4px;
    transition: all 0.15s;
    font-size: 0.95rem;
}
.nav-item:hover {
    background: #1f222b;
    color: white;
}
.nav-item.active {
    background: #5865F2;
    color: white;
}
.nav-item svg { width: 20px; height: 20px; }
.user-box {
    border-top: 1px solid #22252e;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 12px 4px;
}
.user-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #5865F2;
}
.user-avatar-default {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #5865F2;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #5865F2;
}
.user-info { flex: 1; min-width: 0; }
.user-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.user-handle {
    font-size: 0.75rem;
    opacity: 0.5;
}
.logout-btn {
    color: #666;
    text-decoration: none;
    font-size: 1.2rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.15s;
}
.logout-btn:hover { color: #e74c3c; background: #2a1f22; }
.main { margin-left: 260px; flex: 1; padding: 40px; }
.section { display: none; }
.section.active { display: block; }
.section h2 { margin: 0 0 1rem; }
.section p { color: #8890a8; }
</style>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">BotShop</div>
        <nav class="nav">
            <a href="#" class="nav-item active" onclick="showSection('server', this); return false;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
                建立伺服器
            </a>
            <a href="#" class="nav-item" onclick="showSection('dev1', this); return false;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
                開發中
            </a>
            <a href="#" class="nav-item" onclick="showSection('dev2', this); return false;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                開發
            </a>
        </nav>
        <div class="user-box">
            {% if user.avatar %}
                <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png?size=64" class="user-avatar" alt="">
            {% else %}
                <div class="user-avatar-default">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
            {% endif %}
            <div class="user-info">
                <div class="user-name">{{ user.global_name }}</div>
                <div class="user-handle">@{{ user.username }}</div>
            </div>
            <a href="/auth/logout" class="logout-btn" title="登出">⏻</a>
        </div>
    </aside>
    <main class="main">
        <div id="section-server" class="section active">
            <h2>建立伺服器</h2>
            <p>伺服器建立功能開發中。</p>
        </div>
        <div id="section-dev1" class="section">
            <h2>開發中</h2>
            <p>此功能正在開發。</p>
        </div>
        <div id="section-dev2" class="section">
            <h2>開發</h2>
            <p>此功能正在開發。</p>
        </div>
    </main>
</div>

<script>
function showSection(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('section-' + id).classList.add('active');
    el.classList.add('active');
}
</script>
{% endblock %}
